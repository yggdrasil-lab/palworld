services:
  palworld-server:
    image: thijsvanloef/palworld-server-docker:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
      - PORT=8211
      - PLAYERS=32
      # MULTITHREADING is deprecated as of image 2.6.0; this is its documented replacement
      # and passes the same -useperfthreads -NoAsyncLoadingThread -UseMultithreadForDS args.
      - ENABLE_PERF_THREADING_ARGS=true
      # Opt-in recovery for negative DeltaTime (image 2.7.0+). Mitigates the frozen-sim /
      # crash class seen on long-uptime hosts. Does not correct a drifting host clock.
      - PALWORLD_ALLOW_NEGATIVE_DELTA_TIME=true
      - RCON_ENABLED=true
      - RCON_PORT=25575
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - UPDATE_ON_BOOT=true
    volumes:
      - /opt/palworld/data:/palworld/
      - /opt/palworld/backups:/palworld/backups
    ports:
      - target: 8211
        published: 8211
        protocol: udp
        mode: host
      - target: 27015
        published: 27015
        protocol: udp
        mode: host
      - target: 25575
        published: 25575
        protocol: tcp
        mode: host
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ "node.hostname == gaia" ]
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
      # Must stay 'any', NOT 'on-failure': PalServer exits 0 on a clean shutdown
      # (scripts/start.sh ends with `exit 0` after the server stops), so 'on-failure'
      # would leave the server down after any graceful stop or RCON-initiated restart.
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD-SHELL", "bash -c '. ./helper_functions.sh && PalworldServerPid > /dev/null || exit 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    networks:
      - aether-net

networks:
  aether-net:
    external: true
